<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>项目管理秘书 · 流程验证</title>
<style>
 body{font-family:system-ui,Segoe UI,Microsoft YaHei,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#222}
 h1{font-size:18px;margin:0 0 12px}
 .row{display:flex;gap:8px}
 input{flex:1;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:6px}
 button{padding:10px 18px;font-size:15px;border:0;border-radius:6px;background:#1a6fd4;color:#fff;cursor:pointer}
 button:disabled{background:#8fb8e6}
 #answer{margin:18px 0;padding:14px;background:#f4f8ff;border-left:4px solid #1a6fd4;border-radius:4px;white-space:pre-wrap;min-height:24px}
 #meta{color:#666;font-size:13px;margin-bottom:10px}
 .step{border:1px solid #e2e2e2;border-radius:6px;margin:6px 0;background:#fafafa}
 .step summary{cursor:pointer;padding:8px 10px;font-size:13px}
 .step pre{margin:0;padding:10px;font-size:12px;overflow:auto;max-height:320px;background:#fff;border-top:1px solid #eee}
 .t{display:inline-block;padding:1px 6px;border-radius:3px;background:#e8f0fe;color:#1a6fd4;margin-right:6px;font-size:12px}
</style>
</head>
<body>
<h1>项目管理秘书 · 流程验证（模型自主查库回答）</h1>
<div class="row">
  <input id="q" placeholder="输入补全后的标准问题，例如：截至2026年9月，全市的预算总额是多少？" />
  <button id="go" onclick="ask()">提问</button>
</div>
<div id="meta"></div>
<div id="answer"></div>
<div id="trace"></div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ask(){
  var q=document.getElementById('q').value.trim();
  if(!q)return;
  var b=document.getElementById('go');b.disabled=true;b.textContent='查询中…';
  document.getElementById('answer').textContent='';
  document.getElementById('trace').innerHTML='';
  document.getElementById('meta').textContent='';
  var t0=Date.now();
  fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})
   .then(function(r){return r.json();})
   .then(function(d){
     document.getElementById('answer').textContent=d.answer||'（空）';
     document.getElementById('meta').textContent='工具调用 '+((d.trace||[]).length)+' 次 · 耗时 '+((Date.now()-t0)/1000).toFixed(1)+' 秒';
     var h='';
     (d.trace||[]).forEach(function(s,i){
       var body=JSON.stringify(s.args,null,1)+'\n----\n'+JSON.stringify(s.result,null,1);
       h+='<details class="step"><summary><span class="t">'+i+1+'</span>'+esc(s.tool)+'</summary><pre>'+esc(body)+'</pre></details>';
     });
     document.getElementById('trace').innerHTML=h;
   })
   .catch(function(e){document.getElementById('answer').textContent='请求失败：'+e;})
   .then(function(){b.disabled=false;b.textContent='提问';});
}
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')ask();});
</script>
</body>
</html>
